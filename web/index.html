<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Panimalar Smart Transit - College Bus Tracking System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Panimalar Smart Transit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Panimalar Smart Transit</title>
  <link rel="manifest" href="manifest.json">

  <!-- Premium Splash Screen Styles -->
  <style>
    /* Reset body margin to ensure full screen coverage */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF; /* White background as requested */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Splash screen overlay */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      opacity: 1;
      visibility: visible;
    }

    /* Fade-out class applied via JavaScript */
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* App Logo */
    .splash-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      object-fit: contain;
      /* Soft fade-in animation for logo */
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    /* Typography */
    .splash-title {
      font-size: 24px;
      font-weight: 700;
      color: #1E293B; /* Slate 800 for premium contrast */
      margin: 0 0 8px 0;
      text-align: center;
      letter-spacing: -0.5px;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .splash-subtitle {
      font-size: 14px;
      font-weight: 500;
      color: #64748B; /* Slate 500 */
      margin: 0 0 40px 0;
      text-align: center;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .splash-loading-text {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8; /* Slate 400 */
      margin-top: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    /* Premium Loading Indicator (Pulsing Gradient Bar) */
    .loader-container {
      width: 200px;
      height: 4px;
      background-color: #F1F5F9; /* Slate 100 */
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3B82F6, #2563EB); /* Blue gradient */
      border-radius: 4px;
      animation: loading-shimmer 1.5s infinite ease-in-out;
    }

    /* Keyframes for animations */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loading-shimmer {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  
  <!-- Splash Screen DOM Elements -->
  <div id="splash-screen">
    <!-- Logo -->
    <img src="icons/Icon-192.png" alt="Panimalar Logo" class="splash-logo">
    
    <!-- Title & Subtitle -->
    <h1 class="splash-title">Panimalar Smart Transit</h1>
    <h2 class="splash-subtitle">Smart College Bus Tracking System</h2>
    
    <!-- Animated Loading Indicator -->
    <div class="loader-container">
      <div class="loader-bar"></div>
    </div>
    
    <!-- Loading Text -->
    <p class="splash-loading-text">Loading Application...</p>
  </div>

  <!-- Splash Screen Removal Logic -->
  <script>
    function hideSplashScreen() {
      var splashScreen = document.getElementById('splash-screen');
      if (splashScreen && !splashScreen.classList.contains('fade-out')) {
        splashScreen.classList.add('fade-out');
        setTimeout(function() {
          if (splashScreen.parentNode) {
            splashScreen.parentNode.removeChild(splashScreen);
          }
        }, 500);
      }
    }

    // Standard Flutter event for when the app is ready and painted
    document.addEventListener('flutter-first-frame', hideSplashScreen);
    
    // Fallback: forcefully remove the splash screen after 6 seconds 
    // so it doesn't get stuck forever in case of a slow network or hidden error.
    setTimeout(hideSplashScreen, 6000);
  </script>


  <!-- Default Flutter Initialization -->
  <!-- Keeps Flutter's bootstrap logic entirely untouched -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
